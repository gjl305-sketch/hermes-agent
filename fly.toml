app = 'hermes-germ'
primary_region = 'ord'

[processes]
  app = 'gateway run'

[build]
  dockerfile = 'Dockerfile'

[env]
  API_SERVER_HOST = '0.0.0.0'
  API_SERVER_PORT = '8642'

[http_service]
  internal_port = 8642
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = 'hermes_state'
  destination = '/opt/data'
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
